<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Cloudflare 播放测试</title>
<style>body{margin:0;padding:16px;font:16px/1.5 -apple-system,"PingFang SC",sans-serif;background:#fff;color:#111}
h2{font-size:17px;margin:24px 0 8px}video{width:100%;aspect-ratio:16/9;background:#000;display:block}p{color:#666;font-size:14px;margin:6px 0 0}</style></head>
<body>
<h1 style="font-size:20px;margin:0">播放测试（临时页面）</h1>
<p>关掉 VPN，在微信里打开，点播放看完。下面会自动显示：起播用了几秒、卡了几次、下载速度</p>
<h2>Cloudflare</h2>
<video controls playsinline webkit-playsinline x5-playsinline preload="none" src="https://media.praxisai.online/too-late-to-love-you.mp4"></video>
<p class="m">还没播放</p>
<script>
document.querySelectorAll("video").forEach(function(v){var m=v.nextElementSibling,t0=0,first=0,stalls=0;
function show(){var b=0;try{b=v.buffered.length?v.buffered.end(v.buffered.length-1):0}catch(e){}
var sec=(performance.now()-t0)/1000,mb=b/57.087*51.07;
m.textContent="起播 "+(first?first.toFixed(1)+" 秒":"等待中")+" · 卡顿 "+stalls+" 次 · 已下载 "+mb.toFixed(1)+" MB · 约 "+(mb*8/sec).toFixed(1)+" Mb/秒";}
v.addEventListener("play",function(){if(!t0){t0=performance.now();setInterval(show,500)}});
v.addEventListener("playing",function(){if(!first)first=(performance.now()-t0)/1000});
v.addEventListener("waiting",function(){if(first)stalls++});});
</script>
</body></html>
